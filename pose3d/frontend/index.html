<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Pose3D — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>

<body>
  <header>
    <h1>Pose3D</h1>
    <nav>
      <a href="/" class="active">Dashboard</a>
      <a href="/review.html">Revisão</a>
    </nav>
  </header>

  <main>
    <section id="dashboard">
      <h2>Dashboard</h2>
      <div class="stats-grid">
        <div class="stat-card"><span id="stat-collected">–</span><label>Coletadas</label></div>
        <div class="stat-card"><span id="stat-processed">–</span><label>Processadas</label></div>
        <div class="stat-card"><span id="stat-auto-approved">–</span><label>Aprovadas automaticamente</label></div>
        <div class="stat-card"><span id="stat-review">–</span><label>Em revisão</label></div>
        <div class="stat-card"><span id="stat-rejected">–</span><label>Rejeitadas</label></div>
        <div class="stat-card"><span id="stat-skeletons">–</span><label>Esqueletos 3D salvos</label></div>
      </div>
    </section>

    <section id="collection">
      <h2>Coleta</h2>
      <form id="collect-form">
        <label for="tags">Tags de busca (separadas por espaço)</label>
        <input type="text" id="tags" name="tags" placeholder="1girl standing solo">
        <div class="collect-actions">
          <button type="submit" id="btn-start">Iniciar</button>
          <button type="button" id="btn-pause">Pausar</button>
          <button type="button" id="btn-resume">Retomar</button>
        </div>
      </form>
      <div id="collect-progress">
        <p>Status: <span id="collect-status">parado</span></p>
        <progress id="collect-bar" value="0" max="100"></progress>
      </div>
      <ul id="collect-errors"></ul>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>

</html>
